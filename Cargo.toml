[package]
name = "awesomejt-agent-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CLI scaffold for orchestrating coding agents with explicit model routing"
license = "Apache-2.0"
repository = "https://github.com/awesomejt/agent-harness"
publish = false

[[bin]]
name = "ah"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"
