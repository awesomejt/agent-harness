[package]
name = "ah-acp-lifecycle-experiment"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[dependencies]
agent-client-protocol = { version = "=3.6.0", default-features = false }
awesomejt-agent-harness = { path = "../../.." }
libc = "=0.2.177"
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt", "process", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "=0.7.16", features = ["compat"] }
